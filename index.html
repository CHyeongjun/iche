<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 콘텐츠 보안 정책(CSP): 허용된 출처 외 스크립트 실행 차단 (XSS 완화) -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net data:; img-src 'self' data: blob: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>개인 기록 보관소 - Personal Record Hub</title>

  <!-- 🛡️ 0초 안티 디버깅 센티널 보안 가드 (로딩 최상단 필수) -->
  <script src="guard.js?v=2"></script>

  <!-- 웹폰트 & 스타일시트 -->
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5.0.20/index.min.css" />
  <link rel="stylesheet" href="styles.css?v=8" />
</head>

<body>
  <!-- 🌌 3D 사이버네틱 입체 공간 배경 레이어 -->
  <div class="cyber-spatial-backdrop" aria-hidden="true">
    <div class="cyber-ambient-light"></div>
    <div class="cyber-horizon-glow"></div>
    <div class="cyber-grid-3d"></div>
    <div class="cyber-vignette"></div>
  </div>

  <!-- 관리자 모드 활성화 알림 바 -->
  <div class="admin-indicator-bar hidden" id="adminIndicatorBar">
    <div class="admin-indicator-content">
      <span>👑 <strong>관리자 모드</strong>로 접속 중입니다.</span>
    </div>
  </div>

  <!-- 상단 헤더 -->
  <header class="app-header">
    <div class="header-container">
      <div class="header-left">
        <a href="#" class="brand-link" id="brandHomeBtn">
          <span class="brand-badge">Iche's</span>
          <span class="brand-title">Archive</span>
        </a>
      </div>

      <div class="header-center">
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="searchInput" class="search-input" placeholder="기록 검색 (제목, 내용, 태그)..."
            autocomplete="off" />
          <button type="button" class="search-clear-btn hidden" id="searchClearBtn">✕</button>
        </div>
      </div>

      <div class="header-right">
        <!-- 새 기록 작성 버튼 (관리자 전용) -->
        <button type="button" class="btn-primary btn-new-record hidden" id="openWriteModalBtn">
          <span>작성</span>
        </button>

        <!-- 관리자 로그인/로그아웃 버튼 -->
        <button type="button" class="btn-admin-auth" id="adminAuthBtn" title="Login">
          <span id="adminAuthBtnText">Login</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 메인 레이아웃 -->
  <main class="app-main">
    <!-- 컨트롤 바: 필터 탭 & 카테고리 -->
    <div class="control-bar" id="controlBar">
      <div class="visibility-tabs" id="visibilityTabs">
        <button type="button" class="tab-btn active" data-filter="all">All</button>
        <button type="button" class="tab-btn" data-filter="public">🌐 Public</button>
        <button type="button" class="tab-btn tab-private hidden" id="privateFilterTab" data-filter="private">🔒
          Private</button>
      </div>

      <div class="category-pills" id="categoryPills">
        <!-- 카테고리 칩들이 JS에 의해 동적 렌더링됩니다 -->
      </div>
    </div>

    <!-- 1. 기록 목록 뷰 -->
    <section class="records-view" id="recordsView">
      <div class="records-header">
        <div class="records-count-info">
          총 <strong id="recordsCountNumber">0</strong>개의 기록
        </div>
      </div>

      <div class="records-grid" id="recordsGrid">
        <!-- 기록 카드들이 동적으로 렌더링됩니다 -->
        <div class="loading-state">
          <div class="spinner"></div>
          <p>기록을 안전하게 불러오는 중입니다...</p>
        </div>
      </div>
    </section>

    <!-- 2. 기록 상세 읽기 뷰 -->
    <section class="record-detail-view hidden" id="recordDetailView">
      <div class="detail-actions-bar">
        <button type="button" class="btn-back" id="backToListBtn">
          <span>← 목록으로 돌아가기</span>
        </button>
        <div class="detail-admin-actions hidden" id="detailAdminActions">
          <button type="button" class="btn-action btn-edit" id="editRecordBtn">수정</button>
          <button type="button" class="btn-action btn-delete" id="deleteRecordBtn">삭제</button>
        </div>
      </div>

      <article class="record-detail-card" id="recordDetailCard">
        <!-- 상세 본문이 동적으로 채워집니다 -->
      </article>
    </section>
  </main>

  <!-- 기록 작성 및 수정 모달 -->
  <div class="modal-overlay hidden" id="writeModal">
    <div class="modal-dialog write-modal-dialog">
      <div class="modal-header">
        <div class="modal-header-left">
          <h3 class="modal-title" id="writeModalTitle">새 기록 작성</h3>
          <div class="modal-view-mode-toggle" id="modalViewToggle">
            <button type="button" class="btn-mode-toggle active" data-mode="split">📑 나란히 보기</button>
            <button type="button" class="btn-mode-toggle" data-mode="editor">✏️ 작성</button>
            <button type="button" class="btn-mode-toggle" data-mode="preview">👁️ 미리보기</button>
          </div>
        </div>
        <button type="button" class="btn-modal-close" id="closeWriteModalBtn">✕</button>
      </div>

      <div class="modal-body-split" id="modalBodySplit">
        <!-- 좌측: 에디터 칼럼 -->
        <div class="modal-col-editor" id="modalColEditor">
          <form id="writeRecordForm" class="record-form" autocomplete="off">
            <!-- 제목 및 카테고리 -->
            <div class="form-row">
              <div class="form-group flex-2">
                <label class="form-label" for="recordTitleInput">기록 제목 *</label>
                <input type="text" id="recordTitleInput" class="form-control" placeholder="기록 제목을 입력하세요" required />
              </div>
              <div class="form-group flex-1">
                <label class="form-label" for="recordCategorySelect">카테고리</label>
                <select id="recordCategorySelect" class="form-control">
                  <option value="일상">일상</option>
                  <option value="아이디어">게임</option>
                  <option value="연구/개발">공부</option>
                  <option value="메모">메모</option>
                  <option value="문서/자료">문서/자료</option>
                  <option value="코드/기술">코드</option>
                  <option value="비밀">비밀</option>
                </select>
              </div>
            </div>

            <!-- 🔒 핵심: 공개 / 비공개 설정 (Public vs Private) -->
            <div class="form-group">
              <label class="form-label">Visibility (공개 범위) *</label>
              <div class="visibility-switch-box">
                <label class="visibility-option active" id="labelPublic">
                  <input type="radio" name="recordVisibility" value="public" checked />
                  <span class="vis-icon">🌐</span>
                  <div class="vis-text">
                    <strong>Public</strong>
                    <small>공개</small>
                  </div>
                </label>
                <label class="visibility-option" id="labelPrivate">
                  <input type="radio" name="recordVisibility" value="private" />
                  <span class="vis-icon">🔒</span>
                  <div class="vis-text">
                    <strong>Private</strong>
                    <small>비공개</small>
                  </div>
                </label>
              </div>
            </div>

            <!-- 태그 입력 -->
            <div class="form-group">
              <label class="form-label" for="recordTagInput">태그 (쉼표 또는 엔터로 구분)</label>
              <input type="text" id="recordTagInput" class="form-control" placeholder="예: 개발, 코드, 자바스크립트, 비밀" />
              <div class="tags-badge-container" id="writeModalTagsContainer"></div>
            </div>

            <!-- 📷 사진(이미지) 업로드 섹션 -->
            <div class="form-group">
              <div class="upload-section-header">
                <label class="form-label">📷 사진 첨부 (다중 선택 가능)</label>
                <span class="upload-hint">JPG, PNG, GIF, WEBP 지원</span>
              </div>
              <div class="drop-zone" id="photoDropZone">
                <input type="file" id="photoFileInput" multiple accept="image/*" class="file-hidden-input" />
                <div class="drop-zone-content">
                  <span class="drop-icon">🖼️</span>
                  <p>사진을 이곳에 끌어다 놓거나 <strong>클릭하여 사진 선택</strong></p>
                </div>
              </div>
              <!-- 업로드된 사진 썸네일 미리보기 리스트 -->
              <div class="preview-thumbnails-grid" id="photoPreviewList"></div>
            </div>

            <!-- 📁 일반 파일 첨부 섹션 (PDF, 문서, zip 등) -->
            <div class="form-group">
              <div class="upload-section-header">
                <label class="form-label">📁 파일 첨부 (문서, PDF, ZIP 등)</label>
                <span class="upload-hint">다운로드 가능한 파일 보관</span>
              </div>
              <div class="drop-zone" id="fileDropZone">
                <input type="file" id="generalFileInput" multiple class="file-hidden-input" />
                <div class="drop-zone-content">
                  <span class="drop-icon">📎</span>
                  <p>파일을 이곳에 끌어다 놓거나 <strong>클릭하여 파일 선택</strong></p>
                </div>
              </div>
              <!-- 첨부된 파일 목록 카드 리스트 -->
              <div class="attached-files-list" id="filePreviewList"></div>
            </div>

            <!-- 서식 도구 바 -->
            <div class="editor-toolbar">
              <button type="button" class="btn-tb" id="tbBold" title="굵게"><strong>B</strong></button>
              <button type="button" class="btn-tb" id="tbHeading" title="큰 제목">H2</button>
              <button type="button" class="btn-tb" id="tbSubHeading" title="중간 제목">H3</button>
              <button type="button" class="btn-tb" id="tbHighlight" title="형광펜"><mark>Highlight</mark></button>
              <div class="tb-divider"></div>
              <!-- 💻 코드 기록 도구 -->
              <button type="button" class="btn-tb btn-tb-code" id="tbCodeBlock"
                title="코드 블록 삽입 (```language ... ```)"><strong>&lt;/&gt; 코드</strong></button>
              <button type="button" class="btn-tb" id="tbInlineCode" title="인라인 코드 (`code`)">`코드`</button>
              <div class="tb-divider"></div>
              <!-- 폰트 크기 정밀 조절 스텝퍼 -->
              <div class="font-stepper-box">
                <button type="button" class="btn-step" id="fontDecBtn" title="글자 작게">-</button>
                <input type="number" id="fontSizeInput" value="16" min="12" max="36" class="step-num-input" />
                <span class="step-unit">px</span>
                <button type="button" class="btn-step" id="fontIncBtn" title="글자 크게">+</button>
              </div>
            </div>

            <!-- 본문 텍스트 -->
            <div class="form-group">
              <label class="form-label" for="recordContentInput">내용</label>
              <textarea id="recordContentInput" class="form-control record-textarea" rows="8"
                placeholder="개인 생각, 메모, 일기, 업무 내용 또는 코드(```js ... ```)를 자유롭게 기록하세요." required></textarea>
            </div>

            <div class="modal-actions">
              <button type="button" class="btn-cancel" id="cancelWriteBtn">취소</button>
              <button type="submit" class="btn-primary" id="saveRecordSubmitBtn">저장</button>
            </div>
          </form>
        </div>

        <!-- 우측: 실시간 일체형 미리보기 칼럼 -->
        <div class="modal-col-preview" id="modalColPreview">
          <div class="preview-header">
            <div class="preview-header-title">
              <span class="preview-badge">LIVE PREVIEW</span>
              <span class="preview-title-sub">실시간 미리보기</span>
            </div>
            <div class="preview-sub-tabs" id="previewSubTabs">
              <button type="button" class="preview-tab active" data-preview-type="detail">본문 상세</button>
              <button type="button" class="preview-tab" data-preview-type="card">목록 카드</button>
            </div>
          </div>

          <div class="preview-scroll-pane">
            <!-- 1) 상세 뷰 실시간 미리보기 -->
            <div class="live-preview-detail" id="livePreviewDetail">
              <div class="preview-placeholder">내용을 입력하면 실제 화면에 표시될 모습이 실시간으로 나타납니다.</div>
            </div>

            <!-- 2) 카드 뷰 실시간 미리보기 -->
            <div class="live-preview-card hidden" id="livePreviewCard">
              <!-- 실시간 카드 렌더링 -->
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 관리자 로그인 모달 -->
  <div class="modal-overlay hidden" id="authModal">
    <div class="modal-dialog auth-modal-dialog">
      <div class="modal-header">
        <div class="auth-modal-title-wrap">
          <span class="auth-icon">🔒</span>
        </div>
        <button type="button" class="btn-modal-close" id="closeAuthModalBtn">✕</button>
      </div>

      <form id="adminLoginForm" class="auth-form" autocomplete="off">
        <div class="form-group">
          <label for="adminPasswordInput" class="form-label">비밀번호</label>
          <input type="password" id="adminPasswordInput" name="rec_owner_key" class="form-control"
            placeholder="비밀번호를 입력하세요" autocomplete="new-password" data-lpignore="true" data-form-type="other"
            required />
        </div>

        <div id="loginErrorMsg" class="form-error-msg hidden"></div>

        <div class="modal-actions">
          <button type="button" class="btn-cancel" id="cancelAuthBtn">취소</button>
          <button type="submit" class="btn-primary">로그인</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 이미지 확대 보기 라이트박스 팝업 -->
  <div class="lightbox-overlay hidden" id="lightboxModal">
    <div class="lightbox-backdrop" id="lightboxBackdrop"></div>
    <div class="lightbox-dialog">
      <button type="button" class="lightbox-close" id="closeLightboxBtn">✕</button>
      <img id="lightboxImg" src="" alt="확대 보기" />
    </div>
  </div>

  <!-- 토스트 알림 컨테이너 -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- 코어 스크립트 로드 -->
  <script src="app.js?v=7"></script>
</body>

</html>
